[package]
name = "oct_lost_files"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["default"] }
features = "0.10.0"
full = "0.3.0"
tokio = "1.53.3"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"