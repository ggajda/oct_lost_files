[package]
name = "oct_lost_files"
version = "0.1.0"
description = "OCT lost files"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", features = ["default"] }
features = "0.10.0"
image = "0.25.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"]}

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
